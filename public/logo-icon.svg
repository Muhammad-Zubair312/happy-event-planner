<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" fill="none">
  <defs>
    <linearGradient id="bgI" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect width="112" height="112" rx="26" fill="url(#bgI)"/>
  <!-- Top highlight rim -->
  <rect width="112" height="56" rx="26" fill="white" opacity="0.07"/>

  <!-- White balloon centered at 56,50 -->
  <path d="M56,14 C74,14 88,26 88,46 C88,64 76,78 64,83 C61,84 51,84 48,83 C36,78 24,64 24,46 C24,26 38,14 56,14 Z"
        fill="white" opacity="0.95"/>

  <!-- Specular on white balloon -->
  <path d="M36,24 C36,19 41,16 46,17 C50,18 52,21 51,25 C50,29 46,30 42,29 C38,28 36,30 36,24 Z"
        fill="white" opacity="0.55"/>

  <!-- Knot -->
  <path d="M50,83 C47,87 46,92 49,93 C52,94 55,91 55,88" fill="rgba(109,40,217,0.55)"/>
  <path d="M62,83 C65,87 66,92 63,93 C60,94 57,91 57,88" fill="rgba(109,40,217,0.55)"/>

  <!-- String -->
  <path d="M56,93 C50,101 62,108 56,116" stroke="rgba(255,255,255,0.38)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Gold star -->
  <path d="M85,16 L86.8,21.5 L92,21.5 L88,24.8 L89.8,30.3 L85,27 L80.2,30.3 L82,24.8 L78,21.5 L83.2,21.5 Z"
        fill="#FCD34D"/>

  <!-- Confetti -->
  <circle cx="22" cy="54" r="3.5" fill="#F9A8D4" opacity="0.80"/>
  <circle cx="20" cy="40" r="2"   fill="#6EE7B7" opacity="0.70"/>
  <circle cx="90" cy="66" r="3"   fill="#FCD34D" opacity="0.75"/>
</svg>
